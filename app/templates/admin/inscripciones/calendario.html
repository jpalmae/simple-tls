{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 mt-8 max-w-7xl">

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-800">Calendario de Capacitaciones</h1>
        <a href="{{ url_for('admin_inscripciones.index') }}"
            class="text-blue-500 hover:text-blue-700 font-medium text-sm">
            <i class="fas fa-list mr-1"></i> Vista de Lista
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-md border border-gray-100 p-4" style="min-height: 600px;">
        <div id="calendario"></div>
    </div>

    <div class="mt-4 flex flex-wrap gap-4 text-xs text-gray-500">
        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-blue-500 mr-2 inline-block"></span>
            Pendiente / En Progreso</div>
        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-green-500 mr-2 inline-block"></span>
            Aprobado</div>
        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-500 mr-2 inline-block"></span> Reprobado
        </div>
        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-gray-400 mr-2 inline-block"></span> Vencido
        </div>
    </div>
</div>

<!-- FullCalendar CDN -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendario');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,dayGridWeek'
            },
            buttonText: {
                today: 'Hoy',
                month: 'Mes',
                week: 'Semana'
            },
            height: 'auto',
            events: {{ eventos | tojson }},
        eventClick: function (info) {
            if (info.event.url) {
                info.jsEvent.preventDefault();
                window.location.href = info.event.url;
            }
        }
        });
    calendar.render();
    });
</script>
{% endblock %}
