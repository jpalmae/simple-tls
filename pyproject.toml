[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "migrations",
    "__pycache__",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, let formatter handle it
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
